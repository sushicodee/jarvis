[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Local voice front-end for Claude Code: push-to-talk -> local Whisper -> Jev 3-tier routing -> Claude Code / quick model / shell -> Kokoro TTS, logged to Obsidian."
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "mlx-whisper>=0.4",
    "kokoro-onnx>=0.4",
]

[project.scripts]
jarvis = "jarvis.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
